<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Camilo 💜</title>
    <style>
        body { margin: 0; padding: 0; background-color: #FFFDD0; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        #mainTitle { color: #000; font-weight: 200; margin-top: 20px; font-size: 3.5rem; text-align: center; z-index: 100; transition: all 0.3s ease; height: 60px; }
        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 80vh; width: 100%; }
        .active { display: flex !important; }
        #playBtn { background-color: #add8e6; border: none; padding: 18px 60px; border-radius: 50px; font-size: 1.5rem; color: white; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-top: 25px; z-index: 1000; }
        #statusDisplay { color: #333; margin-bottom: 10px; font-size: 0.9rem; width: 340px; display: flex; justify-content: space-between; align-items: center; }
        #gameArea { position: relative; width: 350px; height: 450px; background-color: #E6E6FA; border: 3px solid white; border-radius: 20px; overflow: hidden; touch-action: none; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        
        #basket { position: absolute; bottom: 10px; width: 85px; height: 85px; background: url('./image_1.png') no-repeat center/contain; left: 132px; z-index: 10; pointer-events: none; }
        .cat { position: absolute; width: 50px; height: 50px; background: url('./image_2.png') no-repeat center/contain; }
        #sadCatPop { position: absolute; width: 80px; display: none; top: 20px; right: 20px; z-index: 20; }
        .broken-heart { position: absolute; font-size: 30px; user-select: none; z-index: 5; }
        
        #letterWrapper { position: relative; width: 280px; height: 240px; cursor: pointer; margin-top: 60px; }
        .envelope-img { position: absolute; width: 100%; height: 100%; background-size: contain; background-repeat: no-repeat; background-position: center; transition: opacity 0.4s; }
        #closedEnv { background-image: url('./image_0.png'); z-index: 5; }
        #openEnv { background-image: url('./image_3.png'); z-index: 4; opacity: 0; }
        #letterPaper { position: absolute; top: 40px; left: 5%; width: 90%; height: 0; background: url('./image_6.png') no-repeat center/cover; z-index: 3; transition: all 0.9s ease-in-out; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 35px 20px; box-sizing: border-box; text-align: center; border-radius: 8px; border: 1px solid #ddd; }
        
        .revealed #closedEnv { opacity: 0; }
        .revealed #openEnv { opacity: 1; }
        .revealed #letterPaper { height: 380px; top: -240px; z-index: 6; }
        
        .shoo-cat { position: absolute; width: 70px; height: 70px; background: url('./image_8.png') no-repeat center/contain; pointer-events: none; z-index: 150; }
        #flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 2000; transition: opacity 0.4s ease-out; }
    </style>
</head>
<body>

    <h1 id="mainTitle">💜</h1>

    <div id="startScreen" class="screen active">
        <img src="./image_7.png" style="width: 180px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));">
        <button id="playBtn" onclick="startGame()">Play</button>
    </div>

    <div id="gameScreen" class="screen" style="justify-content: flex-start; padding-top: 10px;">
        <div id="statusDisplay">
            <span>Atrapados: <span id="counter">0</span> / 25</span>
            <span id="livesDisplay">❤️❤️❤️</span>
        </div>
        <div id="gameArea">
            <img id="sadCatPop" src="./image_4.png">
            <div id="basket"></div>
        </div>
    </div>

    <div id="finalScreen" class="screen">
        <div id="letterWrapper" onclick="openLetter()">
            <div id="closedEnv" class="envelope-img"></div>
            <div id="openEnv" class="envelope-img"></div>
            <div id="letterPaper">
                <p style="font-family: 'Georgia', serif; font-size: 1.1rem; color: #333; line-height: 1.5; margin: 0;">
                    Gracias por jugar y hablar diario conmigo te aprecio mucho, Camilo
                </p>
            </div>
        </div>
    </div>

    <div id="flash"></div>

    <script>
        let score = 0, misses = 0, gameActive = false, spawnInterval;
        const heartColors = ['💜','🤎','🖤','🩶','🤍','❤️','🧡','💛','💚','🩵','💙'];

        function startGame() {
            score = 0; misses = 0; gameActive = true;
            document.getElementById('counter').innerText = "0";
            document.getElementById('livesDisplay').innerText = "❤️❤️❤️";
            document.getElementById('mainTitle').innerHTML = "💜";
            document.getElementById('startScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
            spawnInterval = setInterval(() => { if (gameActive) spawnObject(Math.random() > 0.3 ? 'cat' : 'bad'); }, 650);
        }

        function moveBasket(e) {
            if (!gameActive) return;
            const rect = document.getElementById('gameArea').getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let x = clientX - rect.left - 42;
            document.getElementById('basket').style.left = Math.max(0, Math.min(x, 265)) + 'px';
        }

        document.getElementById('gameArea').addEventListener('mousemove', moveBasket);
        document.getElementById('gameArea').addEventListener('touchmove', moveBasket, {passive: false});

        function spawnObject(type) {
            const obj = document.createElement('div');
            obj.className = type === 'cat' ? 'cat' : 'broken-heart';
            if(type === 'bad') obj.innerHTML = '💔';
            obj.style.left = Math.random() * 300 + 'px';
            obj.style.top = '-50px';
            document.getElementById('gameArea').appendChild(obj);

            let posY = -50, speed = 3.5 + Math.random() * 2.5;
            const fall = setInterval(() => {
                if (!gameActive) { clearInterval(fall); obj.remove(); return; }
                posY += speed; obj.style.top = posY + 'px';
                const bRect = document.getElementById('basket').getBoundingClientRect();
                const oRect = obj.getBoundingClientRect();

                if (oRect.bottom > bRect.top + 20 && oRect.left < bRect.right - 10 && oRect.right > bRect.left + 10 && oRect.top < bRect.bottom) {
                    clearInterval(fall); obj.remove();
                    if (type === 'cat') { 
                        score++; 
                        document.getElementById('mainTitle').innerHTML = heartColors[Math.floor(Math.random() * heartColors.length)]; 
                    } else { 
                        score = Math.max(0, score - 1); 
                        showSad(); 
                    }
                    document.getElementById('counter').innerText = score;
                    if (score >= 25) win();
                }

                if (posY > 450) {
                    clearInterval(fall); obj.remove();
                    if (type === 'cat') { 
                        misses++; 
                        updateLives(); 
                        if (misses >= 3) { alert("¡Casi! Inténtalo de nuevo ❤️"); location.reload(); } 
                    }
                }
            }, 20);
        }

        function updateLives() {
            let s = ""; for(let i=0;i<(3-misses);i++) s+="❤️"; for(let i=0;i<misses;i++) s+="🖤";
            document.getElementById('livesDisplay').innerText = s;
        }

        function showSad() { 
            const s = document.getElementById('sadCatPop'); s.style.display = 'block'; 
            setTimeout(() => s.style.display = 'none', 700); 
        }

        function win() {
            gameActive = false; 
            clearInterval(spawnInterval);
            const flash = document.getElementById('flash');
            flash.style.opacity = 1; // Destello blanco
            
            setTimeout(() => { 
                document.getElementById('gameScreen').classList.remove('active'); 
                document.getElementById('mainTitle').style.display = "none";
                document.getElementById('finalScreen').classList.add('active'); 
                flash.style.opacity = 0; // Quitar destello
            }, 500);
        }

        function openLetter() { 
            const w = document.getElementById('letterWrapper'); 
            if(w.classList.contains('revealed')) return; 
            w.classList.add('revealed'); 
            setTimeout(explodeCats, 500); 
        }

        function explodeCats() {
            for (let i = 0; i < 12; i++) {
                const c = document.createElement('div'); c.className = 'shoo-cat';
                const rect = document.getElementById('letterWrapper').getBoundingClientRect();
                c.style.left = (rect.left + 100) + 'px'; c.style.top = (rect.top + 80) + 'px';
                document.getElementById('finalScreen').appendChild(c);
                const angle = Math.random() * Math.PI * 2, speed = 6 + Math.random() * 8;
                let x = parseFloat(c.style.left), y = parseFloat(c.style.top), op = 1;
                const anim = setInterval(() => { x += Math.cos(angle) * speed; y += Math.sin(angle) * speed; op -= 0.025; c.style.left = x + 'px'; c.style.top = y + 'px'; c.style.opacity = op; if (op <= 0) { clearInterval(anim); c.remove(); } }, 20);
            }
        }
    </script>
</body>
</html>
